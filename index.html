<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King SMP</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Montserrat;
}

body{
background:#050814;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#ffd70022,#000);
animation:move 8s infinite alternate;
z-index:-2;
}

@keyframes move{
0%{transform:translate(0,0);}
100%{transform:translate(-60px,40px);}
}

/* LOGIN */
#auth{
position:fixed;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.8);
z-index:9999;
}

.box{
background:rgba(255,255,255,0.06);
padding:25px;
border-radius:15px;
width:320px;
text-align:center;
border:1px solid #ffd70055;
backdrop-filter:blur(10px);
}

.box h1{
color:#ffd700;
margin-bottom:10px;
}

.box input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
outline:none;
}

.box button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#ffd700;
font-weight:bold;
cursor:pointer;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
padding:15px 25px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:1000;
}

nav h1{
color:#ffd700;
}

nav button{
background:#ffd700;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

/* HERO */
.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.title{
font-size:75px;
color:#ffd700;
text-shadow:0 0 30px #ffd700;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{filter:brightness(1);}
to{filter:brightness(1.4);}
}

/* 3D SHOP */
#shop{
display:none;
padding:80px 20px;
}

.shop-warning{
text-align:center;
color:#ffcc00;
margin-bottom:20px;
}

.shop-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
perspective:1000px;
}

/* 3D CARD */
.card{
background:rgba(255,255,255,0.06);
padding:20px;
border-radius:15px;
text-align:center;
border:1px solid rgba(255,215,0,0.2);
transition:0.5s;
transform-style:preserve-3d;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-6px);}
100%{transform:translateY(0);}
}

.card:hover{
transform:rotateY(10deg) rotateX(10deg) scale(1.08);
box-shadow:0 0 30px #ffd70055;
border:1px solid #ffd700;
}

.card button{
margin-top:10px;
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#ffd700;
cursor:pointer;
font-weight:bold;
}

/* POPUP */
.popup{
display:none;
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(10px);
justify-content:center;
align-items:center;
z-index:2000;
}

.popup-box{
background:#111827;
padding:25px;
border-radius:12px;
width:300px;
text-align:center;
border:1px solid #ffd700;
}

.popup-box h2{
color:#ffd700;
}

button{
cursor:pointer;
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- AUTH -->
<div id="auth">
<div class="box">
<h1>👑 King SMP</h1>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login / Register</button>
</div>
</div>

<!-- MAIN -->
<div id="main" style="display:none;">

<nav>
<h1>👑 King SMP</h1>
<button onclick="toggleShop()">SHOP</button>
<button onclick="logout()">Logout</button>
</nav>

<div class="hero">
<div class="title">Welcome <span id="name"></span></div>
</div>

<!-- SHOP -->
<div id="shop">

<div class="shop-warning">
⚠ Only in-game Minecraft currency is used (NO real money)
</div>

<div class="shop-grid">

<div class="card">
VIP Kit<br>VIP Rank
<button onclick="openBuy('VIP')">Buy</button>
</div>

<div class="card">
Elite Kit<br>Elite Rank
<button onclick="openBuy('Elite')">Buy</button>
</div>

<div class="card">
Legend Kit<br>Legend Rank
<button onclick="openBuy('Legend')">Buy</button>
</div>

<div class="card">
Emperor Kit<br>Emperor Rank
<button onclick="openBuy('Emperor')">Buy</button>
</div>

<div class="card">
KING Kit 👑<br>KING Rank
<button onclick="openBuy('KING')">Buy</button>
</div>

</div>
</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-box">
<h2 id="rank"></h2>

<p>📩 DM Owner: Owner°Aarav</p>
<p>⚠ Uses in-game currency only</p>

<button onclick="closeBuy()">Close</button>
</div>
</div>

<script>

/* LOAD ACCOUNT */
let currentUser = localStorage.getItem("user");

if(currentUser){
document.getElementById("auth").style.display="none";
document.getElementById("main").style.display="block";
document.getElementById("name").innerText=currentUser;
}

function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(!u||!p){
alert("Fill details");
return;
}

localStorage.setItem("user",u);

document.getElementById("auth").style.display="none";
document.getElementById("main").style.display="block";
document.getElementById("name").innerText=u;
}

function logout(){
localStorage.removeItem("user");
location.reload();
}

function toggleShop(){
let shop=document.getElementById("shop");

shop.style.display = shop.style.display==="block" ? "none" : "block";
}

function openBuy(rank){
document.getElementById("popup").style.display="flex";
document.getElementById("rank").innerText=rank+" Package";
}

function closeBuy(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
